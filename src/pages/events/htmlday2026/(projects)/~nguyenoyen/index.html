let currentStory = -1;

function onButtonClick() {

  currentStory = (currentStory + 1) % stories.length; // Go to the next story.

  // Our HTML elements have an id="name" attribute, which helps us

  const header = document.getElementById("header");
  const paragraph = document.getElementById("paragraph");

  // Changes the text of the HTML to one of the stories.
  header.innerText = stories[currentStory].storyHeader;
  paragraph.innerText = stories[currentStory].storyParagraph;

  // Changes the background color of the header.
  header.style.backgroundColor = stories[currentStory].color;
  header.style.color= stories[currentStory].textColor;

}

  document.getElementById("following37"),
  document.getElementById("following38"),
  document.getElementById("following39"),
  document.getElementById("following40"),
  document.getElementById("following41")
];
let lastPositionX;
let lastPositionY;
let currentFollowingElement = 0;
function onPointerMove(event) {
  event.preventDefault();
  const mousePositionX = event.clientX;
  const mousePositionY = event.clientY;
  if (!lastPositionX && !lastPositionY) {
    lastPositionX = mousePositionX;
    lastPositionY = mousePositionY;
    return;
  }
  // Calculate the distance between the current mouse position
  // and the last recorded one.
  const distance = Math.sqrt(
    Math.pow(mousePositionX - lastPositionX, 2) +
    Math.pow(mousePositionY - lastPositionY, 2)
  );
  if (distance > 50) {
    const element = trail[currentFollowingElement];
    element.style.position = "absolute";
    element.style.top = lastPositionY + "px";
    element.style.left = lastPositionX + "px";
    lastPositionX = mousePositionX;
    lastPositionY = mousePositionY;
    currentFollowingElement = (currentFollowingElement + 1) % trail.length;
  }
}
document.body.style.touchAction = "none";
document.body.addEventListener("pointermove", onPointerMove);
document.body.addEventListener("pointerdown", (e) => e.preventDefault());

//cursor
</script>
